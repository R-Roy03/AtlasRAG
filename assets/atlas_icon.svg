<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5CE1E6"/>
      <stop offset="50%" stop-color="#7BB8F5"/>
      <stop offset="100%" stop-color="#8B9CF7"/>
    </linearGradient>
  </defs>
  <!-- Central large circle -->
  <circle cx="256" cy="270" r="90" fill="none" stroke="url(#grad)" stroke-width="14"/>
  <circle cx="256" cy="270" r="16" fill="url(#grad)"/>
  <!-- Top-left large node -->
  <line x1="190" y1="205" x2="130" y2="130" stroke="url(#grad)" stroke-width="10" stroke-linecap="round"/>
  <circle cx="115" cy="115" r="50" fill="none" stroke="#5CE1E6" stroke-width="12"/>
  <circle cx="115" cy="115" r="14" fill="#7BB8F5"/>
  <!-- Top-right node -->
  <line x1="320" y1="205" x2="385" y2="140" stroke="url(#grad)" stroke-width="10" stroke-linecap="round"/>
  <circle cx="395" cy="130" r="25" fill="none" stroke="url(#grad)" stroke-width="8"/>
  <circle cx="395" cy="130" r="7" fill="url(#grad)"/>
  <!-- Bottom-right node -->
  <line x1="320" y1="335" x2="385" y2="390" stroke="url(#grad)" stroke-width="10" stroke-linecap="round"/>
  <circle cx="395" cy="400" r="25" fill="none" stroke="url(#grad)" stroke-width="8"/>
  <circle cx="395" cy="400" r="7" fill="url(#grad)"/>
  <!-- Bottom-left node -->
  <line x1="190" y1="340" x2="120" y2="410" stroke="url(#grad)" stroke-width="10" stroke-linecap="round"/>
  <circle cx="110" cy="420" r="20" fill="none" stroke="#5CE1E6" stroke-width="8"/>
  <circle cx="110" cy="420" r="6" fill="#5CE1E6"/>
  <!-- Accent dashes - left -->
  <line x1="50" y1="240" x2="85" y2="240" stroke="#5CE1E6" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  <line x1="55" y1="310" x2="90" y2="310" stroke="#7BB8F5" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  <!-- Accent dashes - right -->
  <line x1="425" y1="175" x2="460" y2="175" stroke="#8B9CF7" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  <line x1="430" y1="355" x2="460" y2="355" stroke="#7BB8F5" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
</svg>
