name: AtlasRAG CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Ruff
        run: pip install ruff

      - name: Run Linter
        run: ruff check . --select E,F,W --ignore E501

  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    needs: lint
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Streamlit Import Check
        run: python -c "import streamlit; print(f'Streamlit {streamlit.__version__}')"

      - name: ChromaDB Import Check
        run: python -c "import chromadb; print(f'ChromaDB {chromadb.__version__}')"

      - name: Run Tests
        run: python -m pytest test_retrieval.py -v

  deploy-check:
    name: 🚀 Deploy Readiness
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Verify requirements.txt
        run: |
          echo "Dependencies:"
          cat requirements.txt
          echo ""
          echo "All deployment files present"